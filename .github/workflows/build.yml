name: Build LobeChat (Docker + Desktop)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 2.1.45-hardy.1)'
        required: false
        type: string

      source_branch:
        description: '选择要构建的分支：next、canary，或输入其他分支名'
        required: false
        default: 'next'
        type: string

      docker_tag:
        description: 'Docker tag'
        required: false
        type: string
        default: 'latest'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/lobehub
  NODE_VERSION: '24.11.1'
  SOURCE_REPO: hardy-one/lobehub
  SOURCE_BRANCH: ${{ github.event.inputs.source_branch || 'next' }}

jobs:
  # ============================================================
  # 版本号：Docker 与桌面端共用同一个版本，避免分别触发时版本不一致
  # ============================================================
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      # ✅ 手动指定版本时使用
      - name: Use manual version
        if: ${{ inputs.version != '' && inputs.version != null }}
        id: version_manual
        run: |
          echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT

      # ✅ 自动计算版本：基于官方 lobehub 的 stable tag
      - name: Calculate hardy version from official lobehub tags
        if: ${{ inputs.version == '' || inputs.version == null }}
        id: version_auto
        run: |
          set -euo pipefail

          # 用 git ls-remote 读取官方 tag 列表，不走 API，避免未认证请求被共享出口 IP 的限流影响
          tags="$(git ls-remote --tags --refs https://github.com/lobehub/lobehub)" || {
            echo "❌ Failed to fetch tags from lobehub/lobehub"
            exit 1
          }

          # 只保留 X.Y.Z 形式的稳定 tag，按版本号排序取最大值（不依赖接口返回顺序）
          latest_tag="$(printf '%s\n' "$tags" \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1 || true)"

          if [ -z "$latest_tag" ]; then
            echo "❌ No stable tag found from lobehub/lobehub"
            exit 1
          fi

          echo "📌 Latest official stable tag: $latest_tag"

          # 解析版本号
          base_version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$base_version"

          # 基于官方版本 +1 作为 hardy base
          new_patch=$((patch + 1))
          base_hardy="${major}.${minor}.${new_patch}"

          # hardy 序号取同一 base 版本下已有 tag 的最大值 +1，不用 run_number。
          # run_number 跟随 workflow 文件，文件拆合或改名都会归零，导致版本号倒退。
          own_tags="$(git ls-remote --tags --refs "https://github.com/${{ github.repository }}.git")" || {
            echo "❌ Failed to fetch tags from ${{ github.repository }}"
            exit 1
          }

          base_re="${base_hardy//./\\.}"
          last_seq="$(printf '%s\n' "$own_tags" \
            | sed 's#.*refs/tags/##' \
            | grep -E "^v${base_re}-hardy\.[0-9]+$" \
            | sed 's/.*-hardy\.//' \
            | sort -n \
            | tail -1 || true)"

          next_seq="$(( ${last_seq:-0} + 1 ))"

          version="${base_hardy}-hardy.${next_seq}"
          tag="v${version}"
          echo "✅ Hardy version: ${version}"
          echo "🏷️ Tag: ${tag}"
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "tag=${tag}" >> $GITHUB_OUTPUT

      - name: Set version output
        id: version
        run: |
          if [ -n "${{ steps.version_manual.outputs.version }}" ]; then
            echo "version=${{ steps.version_manual.outputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=${{ steps.version_manual.outputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.version_auto.outputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=${{ steps.version_auto.outputs.tag }}" >> $GITHUB_OUTPUT
          fi

  # ============================================================
  # Docker 镜像（linux/amd64，推送 Docker Hub）
  # ============================================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [calculate-version]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.docker_tag || 'latest' }}
            ${{ env.IMAGE_NAME }}:${{ needs.calculate-version.outputs.version }}

  # ============================================================
  # Windows 桌面端
  # ============================================================
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-2025
    needs: [calculate-version]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --node-linker=hoisted

      - name: Remove China electron mirror
        shell: bash
        run: |
          if [ -f "./apps/desktop/.npmrc" ]; then
            sed -i.bak '/^electron_mirror=/d; /^electron_builder_binaries_mirror=/d' "./apps/desktop/.npmrc"
            rm -f "./apps/desktop/.npmrc.bak"
          fi

      - name: Install deps on Desktop
        run: npm run install-isolated --prefix=./apps/desktop -- --frozen-lockfile

      # ✅ 设置版本号（格式：X.Y.Z-hardy.N）
      - name: Set package version
        run: npm run workflow:set-desktop-version ${{ needs.calculate-version.outputs.version }} Hardy

      - name: Build Windows App
        run: npm run desktop:package:app
        env:
          UPDATE_CHANNEL: Hardy
          APP_URL: http://localhost:3015
          DATABASE_URL: 'postgresql://postgres@localhost:5432/postgres'
          KEY_VAULTS_SECRET: 'oLXWIiR/AKF+rWaqy9lHkrYgzpATbW3CtJp3UfkVgpE='
          TEMP: C:\temp
          TMP: C:\temp

      - name: List release directory
        shell: pwsh
        run: |
          Write-Host "============================================================"
          Write-Host "  release 目录内容"
          Write-Host "============================================================"
          if (Test-Path apps/desktop/release) {
            Get-ChildItem -Path apps/desktop/release -File | Format-Table Name, Length -AutoSize
          } else {
            Write-Host "❌ release 目录不存在！"
          }
          Write-Host "============================================================"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: apps/desktop/release/
          retention-days: 3

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ needs.calculate-version.outputs.tag }}
          name: ${{ needs.calculate-version.outputs.tag }}
          body: |
            ## 🔨 Hardy Build — ${{ needs.calculate-version.outputs.tag }}

            > Custom build from `${{ env.SOURCE_BRANCH }}` branch of `${{ env.SOURCE_REPO }}`.

            ### 🖥️ Platforms
            Windows `*-setup.exe` · macOS arm64 `*.dmg` / `*.zip` · Linux `*.AppImage` / `*.deb` / `*.rpm` / `*.snap` / `*.tar.gz`
            （实际产物取决于各平台构建结果）

            ### ⚠️ Important Notes
            - This is a custom hardy build and is NOT intended for production use.
            - May contain unstable or incomplete changes. Use at your own risk.
            - macOS 产物未签名、未公证：首次打开请「右键 → 打开」，或执行
              `xattr -dr com.apple.quarantine "/Applications/LobeHub-Hardy.app"`。
            - Linux 自动更新仅对 AppImage 生效，其他格式请手动重装。
          files: |
            apps/desktop/release/*.exe*
            apps/desktop/release/latest*.yml
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # macOS 桌面端（Apple Silicon / arm64，GitHub Hosted Runner）
  # ============================================================
  build-macos:
    name: Build macOS Desktop
    runs-on: macos-15
    needs: [calculate-version]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --node-linker=hoisted

      - name: Remove China electron mirror
        shell: bash
        run: |
          if [ -f "./apps/desktop/.npmrc" ]; then
            sed -i.bak '/^electron_mirror=/d; /^electron_builder_binaries_mirror=/d' "./apps/desktop/.npmrc"
            rm -f "./apps/desktop/.npmrc.bak"
          fi

      - name: Install deps on Desktop
        run: npm run install-isolated --prefix=./apps/desktop -- --frozen-lockfile

      # 清理构建残留，规避 electron-builder 在 macOS 上的 hdiutil 问题
      # https://github.com/electron-userland/electron-builder/issues/8415
      - name: Clean previous build artifacts
        run: |
          sudo rm -rf apps/desktop/release || true
          sudo rm -rf apps/desktop/dist || true
          sudo rm -rf /tmp/electron-builder* || true

      # ✅ 设置版本号（格式：X.Y.Z-hardy.N）
      - name: Set package version
        run: npm run workflow:set-desktop-version ${{ needs.calculate-version.outputs.version }} Hardy

      # 未配置 MAC_CSC_LINK 时 electron-builder 自动跳过签名（identity=null），产物为未签名包
      # 如需签名 + 公证，配置 MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
      - name: Build macOS App
        run: npm run desktop:package:app
        env:
          UPDATE_CHANNEL: Hardy
          APP_URL: http://localhost:3015
          DATABASE_URL: 'postgresql://postgres@localhost:5432/postgres'
          KEY_VAULTS_SECRET: 'oLXWIiR/AKF+rWaqy9lHkrYgzpATbW3CtJp3UfkVgpE='
          # 可选：Apple 签名 / 公证
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: List release directory
        run: |
          echo "============================================================"
          echo "  release 目录内容"
          echo "============================================================"
          if [ -d apps/desktop/release ]; then
            ls -lh apps/desktop/release
          else
            echo "❌ release 目录不存在！"
          fi
          echo "============================================================"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-macos
          path: apps/desktop/release/
          retention-days: 3

      # ⚠️ 三个平台 job 并发向同一个 tag 写 release（action 内部已处理 already_exists 竞态）
      # 因此 body 文本必须与 build-windows / build-linux 完全一致，否则会出现随机覆盖
      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ needs.calculate-version.outputs.tag }}
          name: ${{ needs.calculate-version.outputs.tag }}
          body: |
            ## 🔨 Hardy Build — ${{ needs.calculate-version.outputs.tag }}

            > Custom build from `${{ env.SOURCE_BRANCH }}` branch of `${{ env.SOURCE_REPO }}`.

            ### 🖥️ Platforms
            Windows `*-setup.exe` · macOS arm64 `*.dmg` / `*.zip` · Linux `*.AppImage` / `*.deb` / `*.rpm` / `*.snap` / `*.tar.gz`
            （实际产物取决于各平台构建结果）

            ### ⚠️ Important Notes
            - This is a custom hardy build and is NOT intended for production use.
            - May contain unstable or incomplete changes. Use at your own risk.
            - macOS 产物未签名、未公证：首次打开请「右键 → 打开」，或执行
              `xattr -dr com.apple.quarantine "/Applications/LobeHub-Hardy.app"`。
            - Linux 自动更新仅对 AppImage 生效，其他格式请手动重装。
          files: |
            apps/desktop/release/*.dmg*
            apps/desktop/release/*.zip*
            apps/desktop/release/latest*.yml
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Linux 桌面端（x64，AppImage / deb / rpm / snap / tar.gz）
  # ============================================================
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    needs: [calculate-version]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --node-linker=hoisted

      - name: Remove China electron mirror
        shell: bash
        run: |
          if [ -f "./apps/desktop/.npmrc" ]; then
            sed -i.bak '/^electron_mirror=/d; /^electron_builder_binaries_mirror=/d' "./apps/desktop/.npmrc"
            rm -f "./apps/desktop/.npmrc.bak"
          fi

      - name: Install deps on Desktop
        run: npm run install-isolated --prefix=./apps/desktop -- --frozen-lockfile

      - name: Clean previous build artifacts
        run: |
          sudo rm -rf apps/desktop/release || true
          sudo rm -rf apps/desktop/dist || true

      # ✅ 设置版本号（格式：X.Y.Z-hardy.N）
      - name: Set package version
        run: npm run workflow:set-desktop-version ${{ needs.calculate-version.outputs.version }} Hardy

      - name: Build Linux App
        run: npm run desktop:package:app
        env:
          UPDATE_CHANNEL: Hardy
          APP_URL: http://localhost:3015
          DATABASE_URL: 'postgresql://postgres@localhost:5432/postgres'
          KEY_VAULTS_SECRET: 'oLXWIiR/AKF+rWaqy9lHkrYgzpATbW3CtJp3UfkVgpE='

      - name: List release directory
        run: |
          echo "============================================================"
          echo "  release 目录内容"
          echo "============================================================"
          if [ -d apps/desktop/release ]; then
            ls -lh apps/desktop/release
          else
            echo "❌ release 目录不存在！"
          fi
          echo "============================================================"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: apps/desktop/release/
          retention-days: 3

      # ⚠️ body 文本必须与 build-windows / build-macos 完全一致（同一 tag 并发写）
      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ needs.calculate-version.outputs.tag }}
          name: ${{ needs.calculate-version.outputs.tag }}
          body: |
            ## 🔨 Hardy Build — ${{ needs.calculate-version.outputs.tag }}

            > Custom build from `${{ env.SOURCE_BRANCH }}` branch of `${{ env.SOURCE_REPO }}`.

            ### 🖥️ Platforms
            Windows `*-setup.exe` · macOS arm64 `*.dmg` / `*.zip` · Linux `*.AppImage` / `*.deb` / `*.rpm` / `*.snap` / `*.tar.gz`
            （实际产物取决于各平台构建结果）

            ### ⚠️ Important Notes
            - This is a custom hardy build and is NOT intended for production use.
            - May contain unstable or incomplete changes. Use at your own risk.
            - macOS 产物未签名、未公证：首次打开请「右键 → 打开」，或执行
              `xattr -dr com.apple.quarantine "/Applications/LobeHub-Hardy.app"`。
            - Linux 自动更新仅对 AppImage 生效，其他格式请手动重装。
          files: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb*
            apps/desktop/release/*.rpm*
            apps/desktop/release/*.snap*
            apps/desktop/release/*.tar.gz*
            apps/desktop/release/latest*.yml
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
